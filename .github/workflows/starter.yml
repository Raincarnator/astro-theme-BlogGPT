name: Starter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - name: Test export and publishing safeguards
        run: node --test tests/starter.test.mjs
      - name: Export clean starter artifact
        env:
          STARTER_REPOSITORY: ${{ vars.STARTER_REPOSITORY || format('{0}-starter', github.repository) }}
        run: |
          pnpm starter:export "$RUNNER_TEMP/starter" "$STARTER_REPOSITORY"
          tar -czf "$RUNNER_TEMP/starter.tar.gz" -C "$RUNNER_TEMP/starter" .
      - name: Install and build independently of the theme workspace
        working-directory: ${{ runner.temp }}/starter
        env:
          SITE_URL: https://starter.example.com/
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
          test -f dist/zh/posts/hello-world/index.html
          test -f dist/zh/about/index.html
          test -f dist/pagefind/pagefind.js
          grep -q 'https://starter.example.com/' dist/sitemap-0.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-source
          path: ${{ runner.temp }}/starter.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    # No cross-repository credentials or publishing on PRs, forks, or other refs.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.STARTER_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: starter-source
          path: ${{ runner.temp }}/starter-artifact
      - name: Extract verified source
        run: |
          mkdir "$RUNNER_TEMP/starter-publish"
          tar -xzf "$RUNNER_TEMP/starter-artifact/starter.tar.gz" -C "$RUNNER_TEMP/starter-publish"
      - name: Synchronize the template repository
        env:
          STARTER_REPOSITORY: ${{ vars.STARTER_REPOSITORY }}
          STARTER_BRANCH: ${{ vars.STARTER_BRANCH || 'main' }}
          STARTER_TOKEN: ${{ secrets.STARTER_TOKEN }}
        run: node scripts/publish-starter.mjs "$RUNNER_TEMP/starter-publish"
